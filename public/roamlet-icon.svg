<?xml version="1.0" encoding="UTF-8"?>
<!--
  Roamlet app icon — master artwork.

  Export targets:
    iOS      1024x1024 PNG, no transparency, no rounded corners (Apple masks it)
    Android  432x432 foreground + solid #F5EFE3 background layer (adaptive icon).
             Keep all artwork inside the central 288x288 safe zone; the launcher
             may mask anything outside it.
    Play     512x512 PNG

  Export with:
    npx svgexport assets/brand/roamlet-icon.svg assets/brand/icon-1024.png 1024:1024
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FBF7EF"/>
      <stop offset="1" stop-color="#EDE5D6"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2E4A46"/>
      <stop offset="1" stop-color="#1E3230"/>
    </linearGradient>
    <linearGradient id="brass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#DCAE72"/>
      <stop offset="1" stop-color="#C08A4A"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="url(#bg)"/>

  <g transform="translate(2 1) scale(0.94)">
    <g opacity="1">
      <rect x="14" y="9" width="38" height="46" rx="5" fill="#FBF7EF" opacity="0.55"/>
      <rect x="12.5" y="7.5" width="38" height="46" rx="5" fill="#FBF7EF" opacity="0.8"/>
    </g>

    <g transform="rotate(-4 32 32)">
      <rect x="9" y="6" width="40" height="48" rx="6" fill="url(#cover)"/>
      <circle cx="29" cy="26" r="12.5" fill="none" stroke="#C08A4A" stroke-width="1.6" opacity="0.75"/>
      <circle cx="29" cy="26" r="15.5" fill="none" stroke="#C08A4A" stroke-width="0.9"
              stroke-dasharray="2.2 2.6" opacity="0.5"/>
      <path d="M29 15.5 L34.6 32.4 L29 29.1 L23.4 32.4 Z" fill="url(#brass)" stroke-linejoin="round"/>
      <path d="M29 29.1 L34.6 32.4 L29 36.5 L23.4 32.4 Z" fill="#FBF7EF" opacity="0.42" stroke-linejoin="round"/>
      <rect x="17" y="45" width="18" height="2.4" rx="1.2" fill="#FBF7EF" opacity="0.72"/>
      <rect x="17" y="49.5" width="11" height="2.4" rx="1.2" fill="#FBF7EF" opacity="0.5"/>
    </g>

    <g transform="rotate(11 48 46)">
      <circle cx="48" cy="46" r="9.5" fill="#B5453C" opacity="0.92"/>
      <circle cx="48" cy="46" r="7.2" fill="none" stroke="#FBF7EF" stroke-width="1.1" opacity="0.85"/>
      <path d="M48 41.6 l1.32 2.68 2.96.43-2.14 2.09.5 2.94L48 48.35l-2.64 1.39.5-2.94-2.14-2.09 2.96-.43z"
            fill="#FBF7EF"/>
    </g>
  </g>
</svg>
